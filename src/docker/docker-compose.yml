services:
  crabsland:
    image: opencrabs/landing:latest
    container_name: opencrabs-landing
    ports:
      - "19283:19283"
    restart: unless-stopped
    volumes:
      # The public stats snapshot, written on this host by
      # keyproxy-public-stats.timer. Read-only: nginx serves it, nothing in the
      # container may write to it.
      - /srv/opencrabs/stats:/usr/share/nginx/html/stats-data:ro
